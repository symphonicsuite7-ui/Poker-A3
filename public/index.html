<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="screen-orientation" content="landscape" />
  <meta name="x5-orientation" content="landscape" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>四人扑克</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body>
  <!-- 登录 / 注册 -->
  <section id="screen-auth" class="screen">
    <div class="auth-card">
      <h1>四人扑克</h1>
      <p class="auth-sub">登录后创建或加入房间</p>
      <div class="tabs">
        <button type="button" class="tab active" data-tab="login">登录</button>
        <button type="button" class="tab" data-tab="register">注册</button>
      </div>
      <form id="form-auth">
        <div id="avatar-picker" class="avatar-picker" hidden>
          <div class="avatar-picker-label">选择头像</div>
          <div class="avatar-preview-wrap">
            <img id="avatar-preview" class="avatar avatar-lg" src="/avatars/preset-1.svg" alt="头像预览" />
          </div>
          <div class="avatar-presets" id="avatar-presets">
            <button type="button" class="avatar-opt active" data-avatar="/avatars/preset-1.svg"><img src="/avatars/preset-1.svg" alt="红桃" /></button>
            <button type="button" class="avatar-opt" data-avatar="/avatars/preset-2.svg"><img src="/avatars/preset-2.svg" alt="葵扇" /></button>
            <button type="button" class="avatar-opt" data-avatar="/avatars/preset-3.svg"><img src="/avatars/preset-3.svg" alt="方片" /></button>
            <button type="button" class="avatar-opt" data-avatar="/avatars/preset-4.svg"><img src="/avatars/preset-4.svg" alt="梅花" /></button>
            <button type="button" class="avatar-opt" data-avatar="/avatars/preset-5.svg"><img src="/avatars/preset-5.svg" alt="A" /></button>
            <button type="button" class="avatar-opt" data-avatar="/avatars/preset-6.svg"><img src="/avatars/preset-6.svg" alt="K" /></button>
          </div>
          <label class="avatar-upload">
            或上传自己的图片
            <input id="auth-avatar-file" type="file" accept="image/jpeg,image/png,image/gif,image/webp" />
          </label>
        </div>
        <label>用户名<input id="auth-username" autocomplete="username" maxlength="16" required /></label>
        <label>密码<input id="auth-password" type="password" autocomplete="current-password" maxlength="32" required /></label>
        <p id="auth-error" class="form-error" hidden></p>
        <button type="submit" class="btn btn-primary btn-block" id="btn-auth">登录</button>
        <a class="btn btn-ghost btn-block" href="/local.html">本地试玩（模拟线上）</a>
      </form>
    </div>
  </section>

  <!-- 大厅 -->
  <section id="screen-lobby" class="screen" hidden>
    <div class="panel">
      <header class="panel-head">
        <h1>大厅</h1>
        <div class="user-bar">
          <img id="lobby-avatar" class="avatar" src="/avatars/preset-1.svg" alt="" />
          <span id="lobby-username"></span>
          <button type="button" class="btn btn-ghost" id="btn-logout">退出登录</button>
        </div>
      </header>
      <div class="lobby-actions">
        <button type="button" class="btn btn-primary btn-lg" id="btn-create-room">创建房间</button>
        <div class="join-box">
          <input id="join-password" placeholder="输入房间密码" maxlength="8" />
          <button type="button" class="btn btn-primary" id="btn-join-room">加入房间</button>
        </div>
      </div>
      <p id="lobby-error" class="form-error" hidden></p>
    </div>
  </section>

  <!-- 房间等待 -->
  <section id="screen-room" class="screen" hidden>
    <div class="panel">
      <header class="panel-head">
        <h1>房间</h1>
        <button type="button" class="btn btn-ghost" id="btn-leave-room">离开房间</button>
      </header>
      <div class="room-code-box">
        <div class="label">房间密码（发给好友）</div>
        <div class="code" id="room-password">------</div>
        <button type="button" class="btn" id="btn-copy-password">复制密码</button>
      </div>
      <ul class="seat-list" id="seat-list"></ul>
      <p class="room-tip" id="room-tip">等待玩家加入（0/4）</p>
      <p id="room-error" class="form-error" hidden></p>
      <div class="room-actions">
        <button type="button" class="btn btn-primary btn-lg" id="btn-start" disabled>开始游戏</button>
      </div>
    </div>
  </section>

  <!-- 对局 -->
  <section id="screen-game" class="screen screen-game" hidden>
    <div class="app">
      <header class="topbar">
        <h1>四人扑克</h1>
        <div class="topbar-actions">
          <span id="game-room-code" class="meta-chip"></span>
          <button type="button" id="btn-next" class="btn btn-primary" hidden>再来一局</button>
          <button type="button" id="btn-leave-game" class="btn">离开房间</button>
        </div>
      </header>

      <main class="table">
        <div class="seat seat-top" id="seat-top"></div>
        <div class="seat seat-left" id="seat-left"></div>
        <div class="center-info">
          <div id="turn-info" class="turn-info"></div>
          <div id="last-play" class="last-play"></div>
          <div id="team-info" class="team-info"></div>
        </div>
        <div class="seat seat-right" id="seat-right"></div>
        <div class="table-bottom">
          <section class="controls">
            <div id="hint" class="hint">选择手牌后出牌</div>
            <div class="control-btns">
              <button type="button" id="btn-play" class="btn btn-primary">出牌</button>
              <button type="button" id="btn-pass" class="btn">过牌</button>
              <button type="button" id="btn-draw-give" class="btn btn-primary" hidden>确认还牌</button>
              <button type="button" id="btn-clear" class="btn btn-ghost">清空选择</button>
            </div>
          </section>
          <div class="seat seat-bottom" id="seat-bottom"></div>
        </div>
      </main>

      <aside class="log-panel">
        <h2>出牌记录</h2>
        <ul id="log" class="log"></ul>
      </aside>
    </div>
  </section>

  <div id="draw-overlay" class="draw-overlay" hidden>
    <div class="draw-panel">
      <h2 id="draw-title">抽牌</h2>
      <p id="draw-desc" class="draw-desc"></p>
      <div id="draw-targets" class="draw-targets"></div>
      <div id="draw-cards" class="draw-card-groups"></div>
      <div id="draw-timer" class="draw-timer"></div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/cards.js"></script>
  <script src="/js/rules.js"></script>
  <script src="/js/gallery.js"></script>
  <script src="/js/mobile.js"></script>
  <script src="/js/client.js"></script>
</body>
</html>
