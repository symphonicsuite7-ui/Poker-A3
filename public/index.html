<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="screen-orientation" content="landscape" />
  <meta name="x5-orientation" content="landscape" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>天子牌局：葵影</title>
  <link rel="stylesheet" href="/css/style.css?v=20260825-drop-center-text" />
  <link rel="stylesheet" href="/css/app.css?v=20260825-bg-toolbar" />
  <link rel="stylesheet" href="/css/medieval.css?v=20260825-log-left" />
</head>
<body>
  <!-- 登录 / 注册：calm-breeze 氛围 -->
  <section id="screen-auth" class="screen screen-auth">
    <ul class="auth-bubbles" aria-hidden="true">
      <li></li><li></li><li></li><li></li><li></li>
      <li></li><li></li><li></li><li></li><li></li>
    </ul>
    <div class="auth-panel">
        <div class="auth-brand">
          <h1>天子牌局：葵影</h1>
          <p class="auth-sub">登录后创建或加入房间</p>
        </div>
        <div class="tabs" role="tablist">
          <button type="button" class="tab active" data-tab="login">登录</button>
          <button type="button" class="tab" data-tab="register">注册</button>
        </div>
        <form id="form-auth" class="auth-form">
          <div id="avatar-picker" class="avatar-picker" hidden>
            <div class="avatar-hit-wrap">
              <button type="button" id="btn-avatar-pick" class="avatar-hit" title="点击上传头像">
                <div id="avatar-letter" class="avatar avatar-lg avatar-letter" aria-hidden="true">?</div>
                <img id="avatar-preview" class="avatar avatar-lg" alt="头像预览" hidden />
              </button>
              <button type="button" id="btn-clear-avatar" class="avatar-clear" hidden title="清除头像">×</button>
            </div>
            <input id="auth-avatar-file" type="file" accept="image/jpeg,image/png,image/gif,image/webp" tabindex="-1" />
          </div>
          <label id="auth-nickname-wrap" class="auth-field" hidden>
            <span class="sr-only">昵称</span>
            <input id="auth-nickname" maxlength="32" placeholder="昵称（可选）" />
          </label>
          <label class="auth-field">
            <span class="sr-only">用户名</span>
            <input id="auth-username" autocomplete="username" maxlength="16" required placeholder="用户名" />
          </label>
          <label class="auth-field">
            <span class="sr-only">密码</span>
            <input id="auth-password" type="password" autocomplete="current-password" maxlength="32" required placeholder="密码" />
          </label>
          <p id="auth-error" class="form-error" hidden></p>
          <div class="auth-actions">
            <button type="submit" class="btn btn-auth-main" id="btn-auth">登录</button>
            <a class="btn-auth-local" href="/local.html">本地试玩</a>
          </div>
        </form>
    </div>
  </section>

  <!-- 大厅：与登录页同一套 calm-breeze 风格 -->
  <section id="screen-lobby" class="screen screen-lobby" hidden>
    <ul class="auth-bubbles" aria-hidden="true">
      <li></li><li></li><li></li><li></li><li></li>
      <li></li><li></li><li></li><li></li><li></li>
    </ul>
    <div class="lobby-panel">
      <div class="auth-brand">
        <h1>大厅</h1>
        <p class="auth-sub">创建或加入房间</p>
      </div>
      <div class="lobby-user">
        <span id="lobby-avatar" class="lobby-avatar-host"></span>
        <span id="lobby-username" class="lobby-username"></span>
      </div>
      <div class="lobby-actions">
        <button type="button" class="btn-auth-main" id="btn-create-room">创建房间</button>
        <label class="auth-field lobby-join-field">
          <span class="sr-only">房间密码</span>
          <input id="join-password" placeholder="输入房间密码" maxlength="8" autocomplete="off" />
        </label>
        <button type="button" class="btn-breeze-outline" id="btn-join-room">加入房间</button>
      </div>
      <p id="lobby-error" class="form-error" hidden></p>
      <div class="lobby-footer">
        <button type="button" class="btn-auth-local" id="btn-account">我的</button>
        <button type="button" class="btn-auth-local" id="btn-logout">退出登录</button>
      </div>
    </div>
  </section>

  <!-- 房间等待：同一套 calm-breeze 风格 -->
  <section id="screen-room" class="screen screen-room" hidden>
    <ul class="auth-bubbles" aria-hidden="true">
      <li></li><li></li><li></li><li></li><li></li>
      <li></li><li></li><li></li><li></li><li></li>
    </ul>
    <div class="room-panel">
      <div class="auth-brand">
        <h1>房间</h1>
        <p class="auth-sub">把密码发给好友即可加入</p>
      </div>
      <div class="room-code-box">
        <div class="label">房间密码</div>
        <div class="code" id="room-password">------</div>
        <button type="button" class="btn-breeze-outline" id="btn-copy-password">复制密码</button>
      </div>
      <ul class="seat-list" id="seat-list"></ul>
      <p class="room-tip" id="room-tip">等待玩家加入（0/4）</p>
      <p id="room-error" class="form-error" hidden></p>
      <div class="room-actions">
        <button type="button" class="btn-auth-main" id="btn-start" disabled>开始游戏</button>
      </div>
      <div class="lobby-footer">
        <button type="button" class="btn-auth-local" id="btn-leave-room">离开房间</button>
      </div>
    </div>
  </section>

  <!-- 对局 -->
  <section id="screen-game" class="screen screen-game theme-medieval" hidden>
    <div class="app">
      <header class="topbar game-toolbar-bar">
        <button type="button" id="btn-leave-game" class="btn btn-ghost game-back" title="离开房间">←</button>
        <div class="topbar-actions game-toolbar">
          <span id="game-room-code" class="meta-chip"></span>
          <button type="button" id="btn-gallery-bg" class="btn">显示背景图</button>
          <button type="button" id="btn-gallery" class="btn"><span class="btn-ico">🏛</span>图库</button>
          <button type="button" id="btn-next" class="btn btn-primary" hidden>再来一局</button>
        </div>
      </header>

      <main class="table">
        <div class="seat seat-top" id="seat-top"></div>
        <div class="seat seat-left" id="seat-left"></div>
        <div class="center-info">
          <div id="seat-play-top" class="center-play center-play-top"></div>
          <div class="center-mid">
            <div id="seat-play-left" class="center-play center-play-left"></div>
            <div class="center-mid-gap" aria-hidden="true"></div>
            <div id="seat-play-right" class="center-play center-play-right"></div>
          </div>
          <div id="seat-play-bottom" class="center-play center-play-bottom"></div>
        </div>
        <div class="seat seat-right" id="seat-right"></div>
        <div class="table-bottom">
          <section class="controls">
            <div class="control-btns">
              <button type="button" id="btn-play" class="btn btn-primary"><span class="btn-ico">✦</span>出牌</button>
              <button type="button" id="btn-pass" class="btn"><span class="btn-ico">⛨</span>过牌</button>
              <button type="button" id="btn-suggest" class="btn"><span class="btn-ico">✧</span>提示</button>
              <button type="button" id="btn-draw-give" class="btn btn-primary" hidden>确认还牌</button>
              <button type="button" id="btn-clear" class="btn btn-ghost"><span class="btn-ico">↺</span>清空选择</button>
            </div>
          </section>
          <div class="seat seat-bottom" id="seat-bottom"></div>
        </div>
      </main>

      <aside class="log-panel">
        <h2>冒险日志</h2>
        <ul id="log" class="log"></ul>
      </aside>

      <footer class="game-tip-bar">
        <div id="hint" class="hint">选择手牌后出牌</div>
      </footer>
    </div>
  </section>

  <div id="draw-overlay" class="draw-overlay theme-medieval" hidden>
    <div class="draw-panel">
      <h2 id="draw-title">抽牌</h2>
      <p id="draw-desc" class="draw-desc"></p>
      <div id="draw-targets" class="draw-targets"></div>
      <div id="draw-cards" class="draw-card-groups"></div>
      <div class="draw-actions">
        <button type="button" id="btn-draw-devour" class="btn btn-primary" hidden>吞噬</button>
      </div>
      <div id="draw-timer" class="draw-timer"></div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/cards.js?v=20260825-jqk-png"></script>
  <script src="/js/pixel-fire.js?v=20260825-fire-style"></script>
  <script src="/js/preloader.js?v=20260825-fire3"></script>
  <script src="/js/rules.js?v=20260825-wrap-straight"></script>
  <script src="/js/gallery.js?v=20260825-bg-toolbar"></script>
  <script src="/js/account.js?v=20260824-account-breeze"></script>
  <script src="/js/mobile.js"></script>
  <script src="/js/native-ws.js"></script>
  <script src="/js/client.js?v=20260825-drop-center-text"></script>
</body>
</html>
