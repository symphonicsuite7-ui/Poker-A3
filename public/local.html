<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="screen-orientation" content="landscape" />
  <meta name="x5-orientation" content="landscape" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>天子牌局：葵影</title>
  <link rel="stylesheet" href="/css/style.css?v=20260825-drop-center-text" />
  <link rel="stylesheet" href="/css/app.css?v=20260825-bg-toolbar" />
  <link rel="stylesheet" href="/css/medieval.css?v=20260825-log-left" />
</head>
<body>
  <section class="screen screen-game theme-medieval">
    <div class="app">
      <header class="topbar game-toolbar-bar">
        <a class="btn btn-ghost game-back" href="/" title="返回">←</a>
        <div class="topbar-actions game-toolbar">
          <button type="button" id="btn-new" class="btn btn-accent"><span class="btn-ico">⚔</span>新开一局</button>
          <button type="button" id="btn-gallery-bg" class="btn">显示背景图</button>
          <button type="button" id="btn-gallery" class="btn"><span class="btn-ico">🏛</span>图库</button>
          <button type="button" id="btn-next" class="btn btn-primary" hidden>再来一局</button>
          <a class="btn" href="/"><span class="btn-ico">🚪</span>返回登录</a>
        </div>
      </header>

      <main class="table">
        <div class="seat seat-top" id="seat-top"></div>
        <div class="seat seat-left" id="seat-left"></div>
        <div class="center-info">
          <div id="seat-play-top" class="center-play center-play-top"></div>
          <div class="center-mid">
            <div id="seat-play-left" class="center-play center-play-left"></div>
            <div class="center-mid-gap" aria-hidden="true"></div>
            <div id="seat-play-right" class="center-play center-play-right"></div>
          </div>
          <div id="seat-play-bottom" class="center-play center-play-bottom"></div>
        </div>
        <div class="seat seat-right" id="seat-right"></div>
        <div class="table-bottom">
          <section class="controls">
            <div class="control-btns">
              <button type="button" id="btn-play" class="btn btn-primary"><span class="btn-ico">✦</span>出牌</button>
              <button type="button" id="btn-pass" class="btn"><span class="btn-ico">⛨</span>过牌</button>
              <button type="button" id="btn-suggest" class="btn"><span class="btn-ico">✧</span>提示</button>
              <button type="button" id="btn-draw-give" class="btn btn-primary" hidden>确认还牌</button>
              <button type="button" id="btn-clear" class="btn btn-ghost"><span class="btn-ico">↺</span>清空选择</button>
            </div>
          </section>
          <div class="seat seat-bottom" id="seat-bottom"></div>
        </div>
      </main>

      <aside class="log-panel">
        <h2>冒险日志</h2>
        <ul id="log" class="log"></ul>
      </aside>

      <footer class="game-tip-bar">
        <div id="hint" class="hint">选择要出的牌</div>
      </footer>
    </div>
  </section>

  <div id="draw-overlay" class="draw-overlay theme-medieval" hidden>
    <div class="draw-panel">
      <h2 id="draw-title">抽牌</h2>
      <p id="draw-desc" class="draw-desc"></p>
      <div id="draw-targets" class="draw-targets"></div>
      <div id="draw-cards" class="draw-card-groups"></div>
      <div class="draw-actions">
        <button type="button" id="btn-draw-devour" class="btn btn-primary" hidden>吞噬</button>
      </div>
      <div id="draw-timer" class="draw-timer"></div>
    </div>
  </div>

  <script src="/js/cards.js?v=20260825-jqk-png"></script>
  <script src="/js/pixel-fire.js?v=20260825-fire-style"></script>
  <script src="/js/preloader.js?v=20260825-fire3"></script>
  <script src="/js/rules.js?v=20260825-wrap-straight"></script>
  <script src="/js/local-game.js"></script>
  <script src="/js/gallery.js?v=20260825-bg-toolbar"></script>
  <script src="/js/mobile.js"></script>
  <script src="/js/local.js?v=20260825-drop-center-text"></script>
</body>
</html>
